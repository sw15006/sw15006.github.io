<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>संपर्क | Konkan Sanjeevan</title>
<meta name="description" content="Contact Konkan Sanjeevan via WhatsApp or phone">
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
</head>

<body>

<header class="site-header" data-slide="2">
  <div class="nav-container">
    <div class="logo">
      <img src="images/konkansanjeevan_logo.png">
      <span data-mr="कोंकण संजीवन" data-en="Konkan Sanjeevan">कोंकण संजीवन</span>
    </div>

    <button class="lang-btn" onclick="toggleLanguage()">English</button>
    <div class="menu-toggle" onclick="toggleMenu()">☰</div>

    <nav id="navMenu">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="tourism.html">Tourism</a>
      <a href="about.html">About</a>
      <a class="active" href="contact.html">Contact</a>
    </nav>
  </div>

  <h1 class="page-title"
      data-mr="📞 संपर्क"
      data-en="📞 Contact">
      📞 संपर्क
  </h1>
</header>

<section class="section">
  <div class="card">
    <p data-mr="ऑर्डर किंवा माहिती साठी व्हॉट्सॲप करा."
       data-en="Contact us on WhatsApp for orders or enquiries.">
       ऑर्डर किंवा माहिती साठी व्हॉट्सॲप करा.
    </p>

    <a class="btn"
       href="https://wa.me/919664016039?text=नमस्कार,%20मला%20माहिती%20हवी.%20Hello,%20I%20need%20information">
       WhatsApp Now
    </a>
  </div>
</section>

<footer>
© 2026 कोंकण संजीवन
</footer>

<script src="js/main.js">
function toggleMenu(){navMenu.classList.toggle("show")}
let lang=localStorage.getItem("lang")||"mr";
function toggleLanguage(){
  document.querySelectorAll("[data-mr]").forEach(el=>{
    el.innerText=(lang==="mr")?el.dataset.en:el.dataset.mr;
  });
  lang=(lang==="mr")?"en":"mr";
  localStorage.setItem("lang",lang);
}
</script>

</body>
</html>
