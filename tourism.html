<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>पर्यटन | Konkan Sanjeevan</title>
<meta name="description" content="Authentic Konkan tourism, homestays, beaches and village experiences">
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
</head>

<body>

<header class="site-header" data-slide="3">
  <div class="nav-container">
    <div class="logo">
      <img src="images/konkansanjeevan_logo.png">
      <span data-mr="कोंकण संजीवन" data-en="Konkan Sanjeevan">कोंकण संजीवन</span>
    </div>

    <button class="lang-btn" onclick="toggleLanguage()">English</button>
    <div class="menu-toggle" onclick="toggleMenu()">☰</div>

    <nav id="navMenu">
      <a href="index.html" data-mr="मुख्यपृष्ठ" data-en="Home">मुख्यपृष्ठ</a>
      <a href="products.html" data-mr="उत्पादने" data-en="Products">उत्पादने</a>
      <a class="active" href="tourism.html" data-mr="पर्यटन" data-en="Tourism">पर्यटन</a>
      <a href="about.html" data-mr="आमच्याबद्दल" data-en="About">आमच्याबद्दल</a>
      <a href="contact.html" data-mr="संपर्क" data-en="Contact">संपर्क</a>
    </nav>
  </div>

  <h1 class="page-title"
      data-mr="🏖 कोंकण पर्यटन"
      data-en="🏖 Konkan Tourism">
      🏖 कोंकण पर्यटन
  </h1>
</header>

<section class="section">
  <div class="card">
    <p data-mr="• समुद्रकिनारे • गावातील होमस्टे • स्थानिक मार्गदर्शक • निसर्गभ्रमण"
       data-en="• Beaches • Village homestays • Local guides • Nature trails">
       • समुद्रकिनारे • गावातील होमस्टे • स्थानिक मार्गदर्शक • निसर्गभ्रमण
    </p>

    <p data-mr="कोंकणातील निसर्ग, संस्कृती आणि सुरक्षित पर्यटनाचा अनुभव आम्ही देतो."
       data-en="We provide authentic Konkan experiences with nature, culture and safety.">
       कोंकणातील निसर्ग, संस्कृती आणि सुरक्षित पर्यटनाचा अनुभव आम्ही देतो.
    </p>

    <a class="btn"
       href="https://wa.me/919664016039?text=नमस्कार,%20मला%20कोंकण%20पर्यटन%20माहिती%20हवी.%20Hello,%20I%20want%20Konkan%20tourism%20details">
       WhatsApp Enquiry
    </a>
  </div>
</section>

<footer>
© 2026 कोंकण संजीवन | Rooted in Konkan 🌿
</footer>

<script>
/* COMMON JS */
function toggleMenu(){navMenu.classList.toggle("show")}

let lang=localStorage.getItem("lang")||"mr";
function toggleLanguage(){
  document.querySelectorAll("[data-mr]").forEach(el=>{
    el.innerText=(lang==="mr")?el.dataset.en:el.dataset.mr;
  });
  lang=(lang==="mr")?"en":"mr";
  localStorage.setItem("lang",lang);
}

/* SLIDESHOW */
let slide=3;
setInterval(()=>{
  slide=slide===3?1:slide+1;
  document.querySelector(".site-header").setAttribute("data-slide",slide);
},4000);
</script>

</body>
</html>
