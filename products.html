<!DOCTYPE html>
<html lang="mr">
<head>
<link rel="stylesheet" href="css/style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products - Konkan Sanjeevan</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body{
  margin:0;
  font-family:Poppins;
  background:#f4f6f4;
  color:#333;
}

/* ================= HEADER ================= */
.site-header{background:#2f7d32;color:#fff;padding:20px}

.nav-container{
  display:flex;
  align-items:center;
  justify-content:space-between;
  max-width:1100px;
  margin:auto;
}

/* LOGO */
.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:1.3rem;
  font-weight:600;
}

.logo img{
  height:60px;
  width:auto;
  background:#fff;
  padding:6px;
  border-radius:8px;
}

@media (max-width:768px){
  .logo img{height:48px;}
}

/* NAVIGATION */
nav{
  display:flex;
  gap:18px;
}

nav a{
  color:white;
  text-decoration:none;
  padding:6px 10px;
  border-radius:6px;
  font-weight:500;
}

nav a:hover{background:rgba(255,255,255,0.2);}
nav a.active{background:#1b5e20;}

/* LANGUAGE BUTTON */
.lang-btn{
  background:#fff;
  color:#2f7d32;
  border:none;
  padding:6px 10px;
  border-radius:6px;
  font-weight:600;
  cursor:pointer;
}

/* MOBILE MENU */
.menu-toggle{
  display:none;
  font-size:1.8rem;
  cursor:pointer;
}

/* PAGE TITLE */
.page-title{
  text-align:center;
  margin-top:15px;
  font-weight:600;
}

/* ================= PRODUCTS GRID ================= */
.grid{
  max-width:1100px;
  margin:auto;
  padding:40px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:25px;
}

.card{
  background:#fff;
  border-radius:12px;
  box-shadow:0 6px 18px rgba(0,0,0,.08);
}

.card img{
  width:100%;
  border-radius:12px 12px 0 0;
}

.card div{
  padding:15px;
}

.btn{
  background:#2f7d32;
  color:#fff;
  padding:8px 14px;
  text-decoration:none;
  border-radius:5px;
  font-weight:500;
}

/* ================= FOOTER ================= */
footer{
  background:#1b5e20;
  color:#fff;
  text-align:center;
  padding:15px;
}

/* ================= MOBILE ================= */
@media(max-width:768px){
  .menu-toggle{display:block;}
  nav{
    display:none;
    flex-direction:column;
    background:#2f7d32;
    position:absolute;
    right:20px;
    top:70px;
    padding:15px;
    border-radius:10px;
  }
  nav.show{display:flex;}
}

/* ================= HEADER FADE ANIMATION ================= */

.header-fade {
  opacity: 0;
  transition: opacity 1.2s ease-in-out;
}

.header-fade.show {
  opacity: 1;
}

</style>
</head>

<body>

<header class="site-header">
  <div class="nav-container">

    <!-- LOGO -->
    <div class="logo">
      <img src="images/konkansanjeevan_logo.png" alt="Konkan Sanjeevan Logo">
      <span data-mr="कोंकण संजीवन" data-en="Konkan Sanjeevan">कोंकण संजीवन</span>
    </div>

    <!-- LANGUAGE TOGGLE -->
    <button class="lang-btn" id="langBtn" onclick="toggleLanguage()">English</button>

    <!-- MOBILE MENU ICON -->
    <div class="menu-toggle" onclick="toggleMenu()">☰</div>

    <!-- NAVIGATION -->
    <nav id="navMenu">
      <a href="index.html" data-mr="🏠 मुख्यपृष्ठ" data-en="🏠 Home">🏠 मुख्यपृष्ठ</a>
      <a href="products.html" class="active" data-mr="🌾 उत्पादने" data-en="🌾 Products">🌾 उत्पादने</a>
      <a href="tourism.html" data-mr="🏖 पर्यटन" data-en="🏖 Tourism">🏖 पर्यटन</a>
      <a href="about.html" data-mr="ℹ️ आमच्याबद्दल" data-en="ℹ️ About">ℹ️ आमच्याबद्दल</a>
      <a href="contact.html" data-mr="📞 संपर्क" data-en="📞 Contact">📞 संपर्क</a>
    </nav>

  </div>

  <!-- PAGE TITLE -->
  <h1 class="page-title"
      data-mr="🌾 शेतमाल"
      data-en="🌾 Farm Products">
    🌾 शेतमाल
  </h1>
</header>

<section class="grid">

  <!-- PRODUCT CARD 1 -->
  <div class="card">
    <img src="images/rice.jpg" alt="Konkan Rice">
    <div>
      <h3 data-mr="कोंकण भात" data-en="Konkan Rice">कोंकण भात</h3>
      <p data-mr="₹80/किलो" data-en="₹80/kg">₹80/किलो</p>
      <a class="btn"
         href="https://wa.me/919664016039?text=I want Konkan Rice"
         data-mr="व्हॉट्सॲपवर ऑर्डर करा"
         data-en="Order on WhatsApp">
        व्हॉट्सॲपवर ऑर्डर करा
      </a>
    </div>
  </div>

  <!-- PRODUCT CARD 2 -->
  <div class="card">
    <img src="images/mango.jpg" alt="Alphonso Mango">
    <div>
      <h3 data-mr="आल्फन्सो आंबा" data-en="Alphonso Mango">आल्फन्सो आंबा</h3>
      <p data-mr="हंगामी" data-en="Seasonal">हंगामी</p>
      <a class="btn"
         href="https://wa.me/919664016039?text=I want Alphonso Mango"
         data-mr="ऑर्डर करा"
         data-en="Order">
        ऑर्डर करा
      </a>
    </div>
  </div>

  <!-- PRODUCT CARD 3 -->
  <div class="card">
    <img src="images/cashew.jpg" alt="Cashew">
    <div>
      <h3 data-mr="काजू" data-en="Cashew">काजू</h3>
      <p data-mr="₹900/किलो" data-en="₹900/kg">₹900/किलो</p>
      <a class="btn"
         href="https://wa.me/919664016039?text=I want Cashew"
         data-mr="ऑर्डर करा"
         data-en="Order">
        ऑर्डर करा
      </a>
    </div>
  </div>

</section>

<footer>
  © 2026 कोंकण संजीवन
</footer>

<script>
function toggleMenu() {
  document.getElementById("navMenu").classList.toggle("show");
}

let lang = "mr";
function toggleLanguage(){
  document.querySelectorAll("[data-mr]").forEach(el=>{
    el.innerText = (lang==="mr") ? el.dataset.en : el.dataset.mr;
  });
  document.getElementById("langBtn").innerText = (lang==="mr") ? "मराठी" : "English";
  lang = (lang==="mr") ? "en" : "mr";
}
</script>

</body>
</html>
