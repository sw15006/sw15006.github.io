<body>

<header class="site-header products-header" id="header">
  <div class="nav-container">

    <div class="logo">
      <img src="images/konkansanjeevan_logo.png">

    <button class="lang-btn" onclick="toggleLanguage()">English</button>
    <div class="menu-toggle" onclick="toggleMenu()">☰</div>

  <h1 class="page-title" data-mr="शेतमाल" data-en="Farm Products">शेतमाल</h1>

<section class="section grid">

<!-- RICE -->

    <h3 data-mr="कोंकण भात" data-en="Konkan Rice">कोंकण भात</h3>
    <a class="btn" target="_blank"
       href="https://wa.me/919664016039?text=नमस्कार,%20मला%20कोंकण%20भात%20घ्यायचा%20आहे.%20Hello,%20I%20want%20Konkan%20Rice.">
       WhatsApp Order
    </a>
  </div>
</div>

<!-- MANGO -->
<div class="card">
  <div style="position:relative">
    <span class="price-badge">Seasonal</span>
    <img src="images/hapus_amba.jpg">
  </div>
  <div class="card-content">
    <h3 data-mr="आल्फन्सो आंबा" data-en="Alphonso Mango">आल्फन्सो आंबा</h3>

<!-- CASHEW -->
<div class="card">
  <div style="position:relative">
    <span class="price-badge">₹900/kg</span>
    <img src="images/kaju.jpg">
  </div>
  <div class="card-content">
    <h3 data-mr="काजू" data-en="Cashew">काजू</h3>
    <a class="btn" target="_blank"
       href="https://wa.me/919664016039?text=नमस्कार,%20मला%20काजू%20घ्यायचा%20आहे.%20Hello,%20I%20want%20Cashew.">
       WhatsApp Order
    </a>
  </div>
</div>

</section>

<footer>
© 2026 कोंकण संजीवन | Rooted in Konkan 🌿
</footer>

<script>
/* MOBILE MENU */
function toggleMenu(){
  document.getElementById("navMenu").classList.toggle("show");
}

/* LANGUAGE */
let lang = localStorage.getItem("lang") || "mr";
function toggleLanguage(){
  document.querySelectorAll("[data-mr]").forEach(el=>{
    el.innerText = (lang==="mr") ? el.dataset.en : el.dataset.mr;
  });
  lang = (lang==="mr") ? "en" : "mr";
  localStorage.setItem("lang",lang);
}
toggleLanguage();

/* HEADER SLIDESHOW */
const images=[
 "images/header1.jpg",
 "images/header2.jpg",
 "images/header3.jpg"
];
let i=0;
setInterval(()=>{
 document.getElementById("header").style.backgroundImage=`url(${images[i]})`;
 i=(i+1)%images.length;
},4000);
</script>

</body>
</html>
