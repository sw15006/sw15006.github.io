<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>आमच्याबद्दल | Konkan Sanjeevan</title>
<meta name="description" content="About Konkan Sanjeevan – supporting farmers and Konkan heritage">
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
</head>

<body>

<header class="site-header" data-slide="1">
  <div class="nav-container">
    <div class="logo">
      <img src="images/konkansanjeevan_logo.png">
      <span data-mr="कोंकण संजीवन" data-en="Konkan Sanjeevan">कोंकण संजीवन</span>
    </div>

    <button class="lang-btn" onclick="toggleLanguage()">English</button>
    <div class="menu-toggle" onclick="toggleMenu()">☰</div>

    <nav id="navMenu">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="tourism.html">Tourism</a>
      <a class="active" href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>

  <h1 class="page-title"
      data-mr="आमच्याबद्दल"
      data-en="About Us">
      आमच्याबद्दल
  </h1>
</header>

<section class="section">
  <div class="card">
    <h2 data-mr="🌿 कोंकण संजीवन" data-en="🌿 Konkan Sanjeevan">🌿 कोंकण संजीवन</h2>
    <p data-mr="कोंकणातील शेतकरी, उत्पादने आणि पर्यटन यांना एकत्र आणणारे व्यासपीठ."
       data-en="A platform connecting Konkan farmers, products and tourism.">
       कोंकणातील शेतकरी, उत्पादने आणि पर्यटन यांना एकत्र आणणारे व्यासपीठ.
    </p>
  </div>

  <div class="card">
    <h2 data-mr="🎯 आमची दृष्टी" data-en="🎯 Our Vision">🎯 आमची दृष्टी</h2>
    <p data-mr="शेतकऱ्यांना योग्य मूल्य आणि ग्राहकांना विश्वासार्ह गुणवत्ता."
       data-en="Fair value to farmers and trusted quality to customers.">
       शेतकऱ्यांना योग्य मूल्य आणि ग्राहकांना विश्वासार्ह गुणवत्ता.
    </p>
  </div>
</section>

<footer>
© 2026 कोंकण संजीवन
</footer>

<script src="js/main.js">
function toggleMenu(){navMenu.classList.toggle("show")}
let lang=localStorage.getItem("lang")||"mr";
function toggleLanguage(){
  document.querySelectorAll("[data-mr]").forEach(el=>{
    el.innerText=(lang==="mr")?el.dataset.en:el.dataset.mr;
  });
  lang=(lang==="mr")?"en":"mr";
  localStorage.setItem("lang",lang);
}
</script>

</body>
</html>
