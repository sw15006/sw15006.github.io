<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konkan Sanjeevan</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Poppins;background:#f4f6f4;color:#333}

/* HEADER */
.site-header{background:#2f7d32;color:#fff;padding:20px}
.nav-container{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between}

.logo{display:flex;align-items:center;gap:10px;font-size:1.3rem;font-weight:600}
.logo img{height:60px;background:#fff;padding:6px;border-radius:8px}

nav{display:flex;gap:18px}
nav a{color:#fff;text-decoration:none;padding:6px 10px;border-radius:6px}
nav a.active{background:#1b5e20}
nav a:hover{background:rgba(255,255,255,.2)}

.lang-btn{background:#fff;color:#2f7d32;border:none;padding:6px 10px;border-radius:6px;font-weight:600;cursor:pointer}

.menu-toggle{display:none;font-size:1.8rem;cursor:pointer}

.tagline{text-align:center;margin-top:10px;font-size:.95rem}

/* CONTENT */
.section{max-width:1100px;margin:auto;padding:40px 20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:25px}
.card{background:#fff;padding:25px;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.btn{display:inline-block;margin-top:15px;padding:10px 18px;background:#2f7d32;color:#fff;text-decoration:none;border-radius:6px}

/* FOOTER */
footer{background:#1b5e20;color:#fff;text-align:center;padding:15px}

/* MOBILE */
@media(max-width:768px){
  .menu-toggle{display:block}
  nav{display:none;flex-direction:column;background:#2f7d32;position:absolute;right:20px;top:70px;padding:15px;border-radius:10px}
  nav.show{display:flex}
}
</style>
</head>

<body>

<header class="site-header">
  <div class="nav-container">

    <div class="logo">
      <img src="images/konkansanjeevan_logo.png">
      <span data-mr="कोंकण संजीवन" data-en="Konkan Sanjeevan">कोंकण संजीवन</span>
    </div>

    <button class="lang-btn" id="langBtn" onclick="toggleLanguage()">English</button>

    <div class="menu-toggle" onclick="toggleMenu()">☰</div>

    <nav id="navMenu">
      <a href="index.html" class="active" data-mr="🏠 मुख्यपृष्ठ" data-en="🏠 Home">🏠 मुख्यपृष्ठ</a>
      <a href="products.html" data-mr="🌾 उत्पादने" data-en="🌾 Products">🌾 उत्पादने</a>
      <a href="tourism.html" data-mr="🏖 पर्यटन" data-en="🏖 Tourism">🏖 पर्यटन</a>
      <a href="about.html" data-mr="ℹ️ आमच्याबद्दल" data-en="ℹ️ About">ℹ️ आमच्याबद्दल</a>
      <a href="contact.html" data-mr="📞 संपर्क" data-en="📞 Contact">📞 संपर्क</a>
    </nav>

  </div>

  <p class="tagline"
     data-mr="कोंकणाशी नाळ जोडणारे व्यासपीठ"
     data-en="Connecting Konkan">
     कोंकणाशी नाळ जोडणारे व्यासपीठ
  </p>
</header>

<section class="section cards">
  <div class="card">
    <h2 data-mr="🌾 शेतमाल" data-en="🌾 Farm Products">🌾 शेतमाल</h2>
    <p data-mr="थेट शेतकऱ्यांकडून." data-en="Direct from farmers.">
      थेट शेतकऱ्यांकडून.
    </p>
    <a class="btn" href="products.html"
       data-mr="उत्पादने पाहा"
       data-en="View Products">
       उत्पादने पाहा
    </a>
  </div>

  <div class="card">
    <h2 data-mr="🏖 कोंकण पर्यटन" data-en="🏖 Konkan Tourism">🏖 कोंकण पर्यटन</h2>
    <p data-mr="पर्यटन आणि होमस्टे." data-en="Homestays & tours.">
      पर्यटन आणि होमस्टे.
    </p>
    <a class="btn" href="tourism.html"
       data-mr="पर्यटन पाहा"
       data-en="Explore Tourism">
       पर्यटन पाहा
    </a>
  </div>
</section>

<footer>
© 2026 कोंकण संजीवन
</footer>

<script>
function toggleMenu(){
  document.getElementById("navMenu").classList.toggle("show");
}

/* ===== LANGUAGE SYSTEM (FINAL FIX) ===== */
let lang = localStorage.getItem("lang") || "mr";

function applyLanguage(){
  document.querySelectorAll("[data-mr]").forEach(el=>{
    el.innerHTML = (lang === "mr") ? el.dataset.mr : el.dataset.en;
  });
  document.getElementById("langBtn").innerText =
    (lang === "mr") ? "English" : "मराठी";
}

function toggleLanguage(){
  lang = (lang === "mr") ? "en" : "mr";
  localStorage.setItem("lang", lang);
  applyLanguage();
}

applyLanguage();
</script>

</body>
</html>
